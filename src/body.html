<a class="sr" href="#results">결과로 건너뛰기</a>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.4" opacity=".28"/>
        <path d="M2.6 16C6 10.4 10.7 7.6 16 7.6S26 10.4 29.4 16C26 21.6 21.3 24.4 16 24.4S6 21.6 2.6 16Z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="4.6" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="8.2" stroke="var(--accent)" stroke-width="1" opacity=".55"/>
      </svg>
      <div style="min-width:0">
        <div class="brand-c" data-i18n="brandClinic">연세솔안과</div>
        <div class="brand-t" data-i18n="brandTitle">IOL 내비게이터</div>
        <div class="brand-s" data-i18n="brandSub">인공수정체 선택 보조</div>
      </div>
    </div>

    <div class="seg" id="roleSeg" role="group" aria-label="사용자 역할 / Role">
      <button type="button" id="role_patient"   aria-pressed="true">환자</button>
      <button type="button" id="role_counselor" aria-pressed="false">상담</button>
      <button type="button" id="role_doctor"    aria-pressed="false">의사</button>
    </div>
    <div class="seg" role="group" aria-label="언어 / Language">
      <button type="button" id="langKo" aria-pressed="true">한국어</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="iconbtn" id="setBtn" aria-label="설정" title="설정">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
    <button type="button" class="iconbtn" id="themeBtn" aria-label="테마 전환" title="테마 전환">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<div class="disclaimer">
  <div class="wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <p data-i18n="disclaimer"></p>
  </div>
</div>

<main class="wrap">
  <div class="shell">

    <!-- ============ INPUT RAIL ============ -->
    <form class="rail" id="form" autocomplete="off">
      <div id="formSections"></div>
      <div class="actions" id="actions">
        <button type="button" class="btn primary" id="runBtn" data-i18n="runBtn">결과 보기</button>
        <button type="button" class="btn" id="handoffBtn" data-i18n="handoffBtn">인계 코드</button>
        <button type="button" class="btn ghost" id="resetBtn" data-i18n="resetBtn">초기화</button>
        <span class="autohint" id="autoHint" hidden data-i18n="autoHint"></span>
      </div>
    </form>

    <!-- ============ RESULTS ============ -->
    <div class="results" id="results">
      <div class="empty" id="emptyState">
        <h3 data-i18n="emptyTitle">아직 결과가 없습니다</h3>
        <p data-i18n="emptyBody">왼쪽에서 항목을 채운 뒤 <b>결과 보기</b>를 누르세요. 값을 비워 두면 그 항목은 판정에서 제외되고, 대신 ‘확인할 추가 검사’에 표시됩니다.</p>
      </div>
      <div id="resultBody" hidden></div>

      <!-- reference / glossary always visible -->
      <section class="card" id="taxonomyCard">
        <div class="card-h">
          <h3 data-i18n="taxTitle">용어 체계</h3>
          <span class="tag t-neutral" data-i18n="taxTag">ISO 11979-7 · ESCRS</span>
        </div>
        <div class="tblwrap">
          <table class="gloss" id="taxTable"></table>
        </div>
      </section>

      <details class="card fold" id="refCard">
        <summary class="card-h">
          <h3 data-i18n="refTitle">근거 문헌</h3>
          <span class="tag t-neutral" id="refCount"></span>
          <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </summary>
        <div class="foldbody" id="refBox">
          <div class="reflist" id="refList"></div>
        </div>
        <div class="foldfoot">
          <div class="btnrow">
            <button class="btn ghost" type="button" id="refExpandBtn" data-i18n="refExpand">전체 펼치기</button>
          </div>
          <p class="hint" data-i18n="refDrag">상자의 오른쪽 아래 모서리를 끌어 높이를 조절할 수 있습니다.</p>
          <p class="hint" data-i18n="gradeLegend"></p>
        </div>
      </details>
    </div>

  </div>
</main>

<section class="card" id="testcard" hidden style="max-width:var(--maxw);margin:0 auto 40px;">
  <div class="card-h"><h3>Self-test</h3></div>
  <div id="testout"></div>
</section>

<!-- 비밀번호 -->
<div class="ovl" id="pwOvl" hidden>
  <div class="ovl-bd" id="pwBackdrop"></div>
  <section class="card ovl-card" role="dialog" aria-modal="true" aria-labelledby="pwH">
    <div class="card-h">
      <h3 id="pwH" data-i18n="pwTitle">직원용 화면 잠금 해제</h3>
      <button type="button" class="iconbtn" id="pwClose" style="margin-left:auto" aria-label="닫기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="card-b" id="pwBody"></div>
  </section>
</div>

<!-- 설정 -->
<div class="ovl" id="setOvl" hidden>
  <div class="ovl-bd" id="setBackdrop"></div>
  <section class="card ovl-card ovl-wide" role="dialog" aria-modal="true" aria-labelledby="setH">
    <div class="card-h">
      <h3 id="setH" data-i18n="setTitle">설정</h3>
      <button type="button" class="iconbtn" id="setClose" style="margin-left:auto" aria-label="닫기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="card-b" id="setBody"></div>
  </section>
</div>

<!-- 환자 배부용 A5 결과지 (평소에는 숨김, 인쇄할 때만 나타납니다) -->
<div id="a5sheet" aria-hidden="true"></div>

<!-- 인계 코드 패널 -->
<div class="ovl" id="handoffOvl" hidden>
  <div class="ovl-bd" id="handoffBackdrop"></div>
  <section class="card ovl-card" role="dialog" aria-modal="true" aria-labelledby="handoffH">
    <div class="card-h">
      <h3 id="handoffH" data-i18n="handoffTitle">다음 단계로 넘기기</h3>
      <button type="button" class="iconbtn" id="handoffClose" style="margin-left:auto" aria-label="닫기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="card-b" id="handoffBody"></div>
  </section>
</div>

<footer class="foot">
  <div class="wrap">
    <p data-i18n="footer1"></p>
    <p data-i18n="footer2"></p>
  </div>
</footer>
