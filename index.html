<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="연세솔안과 IOL 내비게이터 — 근거 기반 백내장 인공수정체 선택 보조. 환자·상담직원·의사 세 화면, 금기/주의/선호 3계층 의사결정 로직, 문헌 근거 연결.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="연세솔안과 IOL 내비게이터">
<meta property="og:description" content="연세솔안과의 근거 기반 백내장 인공수정체 선택 보조 도구. 임상 의사결정 보조이며 의료기기가 아닙니다.">
<meta property="og:type" content="website">
<title>연세솔안과 IOL 내비게이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* ============================================================
   IOL 내비게이터 — design tokens
   light palette on bare :root ; dark redefined twice (media + stamp)
   ============================================================ */
:root{
  --bg:#F2F5F6;
  --surface:#FFFFFF;
  --surface-2:#E9EFF1;
  --sunken:#E3EBED;
  --ink:#0F1F27;
  --ink-2:#33505C;
  --muted:#5F7B88;
  --faint:#8AA3AE;
  --line:#D5E0E4;
  --line-strong:#B9CAD1;

  --accent:#0E7C86;
  --accent-ink:#075A62;
  --accent-wash:#DDEFF0;
  /* 장식 막대(적합도 바·탈초점 글리프)용. 예전 판에서 --accent 를 그대로 쓰던
  자리라 같은 값을 넣어 두면 보이는 결과가 이전과 같다. */
  --accent-soft:#0E7C86;

  --stop:#B3261E;
  --stop-wash:#FBE6E4;
  --caution:#9A5B00;
  --caution-wash:#FBEEDA;
  --pref:#5048A0;
  --pref-wash:#E9E7F8;
  --ok:#2E6B4F;
  --ok-wash:#DFF0E7;

  --shadow:0 1px 2px rgba(15,31,39,.06), 0 8px 24px -12px rgba(15,31,39,.18);
  --shadow-lift:0 2px 4px rgba(15,31,39,.08), 0 18px 40px -18px rgba(15,31,39,.28);
  --r-sm:5px; --r:9px; --r-lg:14px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --display:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;

  --maxw:1360px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080F13;
    --surface:#101C22;
    --surface-2:#16262D;
    --sunken:#0B161B;
    --ink:#E4EEF1;
    --ink-2:#B6CBD3;
    --muted:#8FA8B2;
    --faint:#6B848F;
    --line:#22343C;
    --line-strong:#31474F;

    --accent:#3FB6BC;
    --accent-ink:#7BD5D8;
    --accent-wash:#0F3237;
    --accent-soft:#3FB6BC;

    --stop:#F08A80;
    --stop-wash:#3A1512;
    --caution:#E0A44A;
    --caution-wash:#33220A;
    --pref:#A49CF0;
    --pref-wash:#1E1B3C;
    --ok:#69C79A;
    --ok-wash:#0F2A1F;

    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#080F13;
  --surface:#101C22;
  --surface-2:#16262D;
  --sunken:#0B161B;
  --ink:#E4EEF1;
  --ink-2:#B6CBD3;
  --muted:#8FA8B2;
  --faint:#6B848F;
  --line:#22343C;
  --line-strong:#31474F;

  --accent:#3FB6BC;
  --accent-ink:#7BD5D8;
  --accent-wash:#0F3237;
  --accent-soft:#3FB6BC;

  --stop:#F08A80;
  --stop-wash:#3A1512;
  --caution:#E0A44A;
  --caution-wash:#33220A;
  --pref:#A49CF0;
  --pref-wash:#1E1B3C;
  --ok:#69C79A;
  --ok-wash:#0F2A1F;

  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.62;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.25;text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;flex:none}
.brand-c{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.02em;color:var(--accent);white-space:nowrap;line-height:1.2}
.brand-t{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;line-height:1.25}
.brand-s{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;border-radius:calc(var(--r) - 3px);
  padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:background .15s, color .15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink-2)}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);
}
.iconbtn:hover{color:var(--ink);border-color:var(--line-strong)}

/* ---------- disclaimer ---------- */
.disclaimer{
  background:var(--caution-wash);
  border-bottom:1px solid color-mix(in srgb, var(--caution) 30%, transparent);
  color:var(--ink);
}
.disclaimer .wrap{display:flex;gap:11px;align-items:flex-start;padding-top:10px;padding-bottom:10px}
.disclaimer svg{flex:none;margin-top:2px;color:var(--caution)}
.disclaimer p{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.disclaimer b{color:var(--ink);font-weight:600}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:26px;padding:22px 0 60px;align-items:start}
@media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr);gap:18px}}
/* 레일 = 고정 높이 컬럼. 실제 스크롤은 #formSections 가 담당하고
   액션바는 스크롤 영역 밖의 푸터라 어떤 스크롤 위치에서도 사라지지 않는다.
   높이는 syncRailHeight() 가 레일의 실제 top 을 읽어 매번 다시 계산한다
   (상단 고지 배너 때문에 top 이 스크롤에 따라 달라지므로 CSS 만으로는 불가). */
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:0;min-height:0}
#formSections{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:12px; padding:0 6px 4px 0;
}
@media (max-width:1000px){
  .rail{position:static;max-height:none !important;overflow:visible}
  #formSections{overflow:visible;min-height:auto;padding-right:0}
}
#formSections{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
#formSections::-webkit-scrollbar{width:9px}
#formSections::-webkit-scrollbar-track{background:var(--sunken);border-radius:9px}
#formSections::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:2px solid var(--bg)}
#formSections::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14px;letter-spacing:-.01em}
.card-b{padding:16px}

/* ---------- accordion sections ---------- */
/* flex:0 0 auto 가 없으면 flex 항목이 shrink 되어 카드가 눌리고
   overflow:hidden 때문에 입력 필드가 잘려 나갑니다. 반드시 유지하세요. */
details.sect{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
details.sect>summary{
  list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:10px;
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;
}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary:hover{background:var(--surface-2)}
.sect-num{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.08em}
.chev{margin-left:auto;color:var(--faint);transition:transform .18s}
details[open]>summary .chev{transform:rotate(90deg)}
.sect-b{padding:6px 16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:18px}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field .flabel{font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--faint);font-weight:400;line-height:1.45}
.unit{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}
select,input[type="number"],input[type="text"]{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:14.5px;min-height:44px;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;color:var(--ink)}
input[type="number"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input::placeholder{color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}

.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;line-height:1.5;padding:2px 0}
.chk input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:none}

/* segmented scale control */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale label{position:relative;display:block}
.scale input{position:absolute;opacity:0;width:0;height:0}
.scale span{
  display:flex;align-items:center;justify-content:center;min-height:46px;
  text-align:center;padding:8px 4px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  font-size:12.5px;line-height:1.28;color:var(--muted);cursor:pointer;background:var(--surface);
  transition:background .13s,color .13s,border-color .13s;
}
.scale input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .scale input:checked+span,
.scale input:checked+span{color:var(--surface)}
.scale input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale span:hover{border-color:var(--accent)}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.empty{
  border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:56px 26px;text-align:center;color:var(--muted);
  background:var(--surface);
}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--ink)}
.empty p{font-size:13.5px;max-width:44ch;margin:0 auto}

/* verdict */
.verdict{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift);overflow:hidden;
}
.verdict-top{padding:20px 22px 18px;border-left:5px solid var(--accent);background:linear-gradient(100deg,var(--accent-wash),transparent 62%)}
.verdict-top .eyebrow{color:var(--accent-ink)}
.verdict-name{font-size:clamp(21px,3.6vw,29px);margin:5px 0 3px}
.verdict-en{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.verdict-why{margin-top:13px;font-size:14px;color:var(--ink-2);max-width:62ch}
.fitrow{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.fitnum{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--accent-ink)}
.fitbar{flex:1;min-width:120px;height:7px;border-radius:99px;background:var(--sunken);overflow:hidden}
.fitbar i{display:block;height:100%;border-radius:99px;background:var(--accent-soft)}

/* ranking table */
.rank{display:flex;flex-direction:column}
.rank-row{
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(96px,1fr) 58px;
  gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);
}
.rank-row:first-child{border-top:0}
.rank-row.is-out{opacity:.62}
.rank-nm{min-width:0}
.rank-nm b{font-family:var(--display);font-weight:700;font-size:13.5px;display:block;letter-spacing:-.01em}
.rank-nm small{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em;display:block;margin-top:1px}
.rank-sc{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent-soft)}
.bar.b-stop i{background:var(--stop)}
.bar.b-caut i{background:var(--caution)}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:99px;white-space:nowrap;
}
.t-stop{background:var(--stop-wash);color:var(--stop)}
.t-caut{background:var(--caution-wash);color:var(--caution)}
.t-ok{background:var(--ok-wash);color:var(--ok)}
.t-pref{background:var(--pref-wash);color:var(--pref)}
.t-neutral{background:var(--sunken);color:var(--muted)}

/* defocus strip — the subject's own instrument as a glyph */
.dstrip{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--sunken);margin-top:5px;max-width:200px}
.dstrip i{display:block;height:100%}

/* finding lists */
.flist{display:flex;flex-direction:column}
.finding{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:12px}
.finding:first-child{border-top:0}
.f-stripe{width:3px;border-radius:99px;flex:none;background:var(--muted)}
.finding.lv-stop .f-stripe{background:var(--stop)}
.finding.lv-caution .f-stripe{background:var(--caution)}
.finding.lv-pref .f-stripe{background:var(--pref)}
.f-body{min-width:0;flex:1}
.f-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.f-title{font-weight:600;font-size:13.5px}
.f-why{font-size:13px;color:var(--ink-2);line-height:1.55}
.f-meta{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f-act{margin-top:7px;font-size:12.5px;color:var(--muted);padding-left:11px;border-left:2px solid var(--line-strong);line-height:1.5}
.f-lens{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:11px;padding:1.5px 7px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.refbtn{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
  border-radius:99px;padding:1px 7px;cursor:pointer;text-decoration:none;
}
.refbtn:hover{border-color:var(--accent);color:var(--accent)}
.grade{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:2px 6px;border-radius:var(--r-sm);background:var(--sunken);color:var(--muted)}
.grade[data-g="A"]{background:var(--ok-wash);color:var(--ok)}
.grade[data-g="B"]{background:var(--accent-wash);color:var(--accent-ink)}
.grade[data-g="C"]{background:var(--caution-wash);color:var(--caution)}
.grade[data-g="D"]{background:var(--sunken);color:var(--muted)}

/* tests checklist */
.tests{display:flex;flex-direction:column;gap:0}
.test{display:flex;gap:11px;padding:11px 18px;border-top:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.test:first-child{border-top:0}
.test svg{flex:none;margin-top:3px;color:var(--accent)}
.test small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}

/* references */
.reflist{display:flex;flex-direction:column}
.ref{padding:13px 18px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.ref:first-child{border-top:0}
.ref-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent-ink)}
.ref b{font-weight:600}
.ref .ref-key{display:block;color:var(--ink-2);margin-top:3px}
.ref a{word-break:break-word;font-size:11.5px;font-family:var(--mono)}
.ref:target{background:var(--accent-wash)}

/* glossary table */
.tblwrap{overflow-x:auto}
table.gloss{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
table.gloss th,table.gloss td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.gloss th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--surface-2)}
table.gloss td b{font-family:var(--display);font-weight:700}
table.gloss td small{color:var(--muted);font-family:var(--mono);font-size:10.5px;display:block}

.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
.btn.primary{color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}

/* ---------- 액션바 — 항상 닿을 수 있는 위치에 고정 ---------- */
.actions{
  position:relative; z-index:30; flex:0 0 auto;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:13px 0 4px;
  background:var(--bg);
  border-top:1px solid var(--line);
  margin-top:2px;
}
.autohint{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.autohint::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--ok);flex:none}
@media (max-width:1000px){
  .actions{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background:color-mix(in srgb, var(--surface) 93%, transparent);
    backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 22px -14px rgba(0,0,0,.5);
  }
  .actions .btn.primary{flex:1 1 auto; justify-content:center}
  .autohint{flex-basis:100%; order:3; margin-top:-2px}
  body{padding-bottom:78px}  /* JS 가 실제 바 높이로 덮어씀 */
  html{scroll-padding-bottom:88px}
}

footer.foot{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--muted);font-size:12px}
footer.foot p{max-width:70ch;line-height:1.6}
footer.foot p + p{margin-top:9px}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 역할 안내 한 줄 ─────────────────────────────────────── */
.rolehint{
  flex:0 0 auto;
  font-size:12.5px;line-height:1.5;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;margin-bottom:12px;
}

/* ── 설명 표의 단계 표시 ──────────────────────────────────── */
.meter{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line-strong);display:block}
.dots i.on{background:var(--accent)}
.mlabel{font-size:11.5px;color:var(--muted)}
table.guide td{vertical-align:top}
table.guide td:first-child{min-width:190px}
table.guide td.gcost{white-space:nowrap;text-align:right}
table.guide td.gcost b{font-size:12.5px}
table.guide th:last-child{text-align:right}
.gsub{display:block;color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px;max-width:42ch;font-weight:400}

/* ── 상담 화면: 선택 확인과 비용 ──────────────────────────── */
.costrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.costbox{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.costline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.costline:first-child{border-top:0}
.costline b{font-size:15px}
.costline.strong{background:var(--accent-wash)}
.costline.sub{font-size:12px;color:var(--muted);background:var(--surface-2)}
.costgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.costitem{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.costpair{display:flex;align-items:center;gap:6px}
.costpair .unit{white-space:nowrap}
.costpair input{height:40px;min-height:40px;text-align:right}
.rank-cost{font-family:var(--mono);font-size:10.5px;color:var(--accent-ink);letter-spacing:.02em;display:block;margin-top:2px}

/* ── 인계 코드 패널 ──────────────────────────────────────── */
.ovl{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.ovl-bd{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 46%, transparent);backdrop-filter:blur(2px)}
.ovl-card{position:relative;width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:var(--shadow-lift)}
.ovl-card .card-b{display:flex;flex-direction:column;gap:14px}
.codebox{
  font-size:15px;letter-spacing:.06em;word-break:break-all;line-height:1.7;
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
  user-select:all;
}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.qrbox svg{border-radius:6px;border:1px solid var(--line)}
.qrbox .hint{text-align:center;max-width:34ch}
.loadbox{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:14px}
.loadrow{display:flex;gap:8px}
.loadrow input{flex:1;min-width:0;height:44px;font-family:var(--mono);letter-spacing:.04em}

[hidden]{display:none !important}
#testout{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;padding:16px;line-height:1.6}
.pass{color:var(--ok)} .fail{color:var(--stop);font-weight:600}
</style>
<style>
@media (max-width:560px){
  .brand-s{display:none}
  .brand-c{font-size:10.5px}
  .brand-t{font-size:15px}
  .mark{width:26px;height:26px}
  .topbar-in{gap:8px;padding:8px 14px}
  .seg button{padding:6px 9px;font-size:12px}
  .iconbtn{width:30px;height:30px}
  .wrap{padding:0 14px}
  .rank-row{grid-template-columns:minmax(0,1.3fr) minmax(70px,.9fr) 42px;gap:9px;padding:11px 13px}
  .finding,.test,.ref{padding-left:13px;padding-right:13px}
  .verdict-top{padding:17px 16px 15px}
}
/* 탈초점 글리프 범례 */
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend .sw{width:16px;height:6px;border-radius:99px;display:block}
@media print{
  .topbar,.rail,.actions,#testcard,.btnrow,.ovl{display:none !important}
  .shell{grid-template-columns:1fr}
  body{background:#fff}
  .card,.verdict{break-inside:avoid;box-shadow:none}
}

/* ══════════════════════════════════════════════════════════════
   환자 배부용 A5 결과지
   화면에서는 숨겨져 있고, '환자용 결과지' 버튼을 누를 때만 인쇄됩니다.
   용지 크기는 JS 가 #pageRule 의 @page 규칙을 바꿔 지정합니다.
   ══════════════════════════════════════════════════════════════ */
#a5sheet{display:none}
@media print{
  body.print-a5 > *{display:none !important}
  body.print-a5 > #a5sheet{display:block !important}
  body.print-a5{padding:0 !important;background:#fff;color:#000}
}
#a5sheet{
  font-family:var(--sans); color:#1a1a1a; background:#fff;
  font-size:9.2pt; line-height:1.45;
}
#a5sheet .a5-head{display:flex;align-items:flex-end;gap:8px;border-bottom:1.6pt solid #0E7C86;padding-bottom:5pt;margin-bottom:8pt}
#a5sheet .a5-clinic{font-family:var(--display);font-weight:800;font-size:12pt;letter-spacing:-.01em;color:#0E7C86}
#a5sheet .a5-doc{font-size:9pt;color:#444;margin-left:auto}
#a5sheet .a5-id{display:flex;gap:14pt;font-size:8.4pt;color:#555;margin-bottom:8pt}
#a5sheet .a5-id span{border-bottom:.6pt solid #bbb;flex:1;padding-bottom:1pt}
#a5sheet h4{font-family:var(--display);font-size:8.4pt;letter-spacing:.06em;color:#0E7C86;margin:9pt 0 3pt;font-weight:800}
#a5sheet .a5-pick{border:1pt solid #B9CAD1;border-left:3pt solid #0E7C86;border-radius:3pt;padding:7pt 9pt;background:#F4FAFB}
#a5sheet .a5-pick b{font-family:var(--display);font-size:13pt;display:block;line-height:1.2}
#a5sheet .a5-pick p{font-size:8.6pt;color:#333;margin-top:3pt}
#a5sheet .a5-bar{display:flex;height:5pt;border-radius:99pt;overflow:hidden;background:#EDE7D9;margin-top:6pt}
#a5sheet .a5-bar i{display:block;height:100%}
#a5sheet .a5-barleg{display:flex;justify-content:space-between;font-size:7.4pt;color:#666;margin-top:2pt}
#a5sheet table{width:100%;border-collapse:collapse;font-size:8.4pt}
#a5sheet td,#a5sheet th{border-bottom:.5pt solid #D5E0E4;padding:3pt 2pt;text-align:left;vertical-align:top}
#a5sheet th{color:#666;font-weight:600;font-size:7.8pt}
#a5sheet .a5-dots i{display:inline-block;width:5pt;height:5pt;border-radius:99pt;background:#C6D5DA;margin-right:2pt}
#a5sheet .a5-dots i.on{background:#0E7C86}
#a5sheet ul{margin:2pt 0 0;padding-left:12pt}
#a5sheet li{margin-bottom:2pt}
#a5sheet .a5-note{background:#F2F5F6;border-radius:3pt;padding:6pt 8pt;font-size:8.4pt}
#a5sheet .a5-cost{display:flex;justify-content:space-between;border-top:.8pt solid #B9CAD1;margin-top:5pt;padding-top:4pt;font-size:9pt}
#a5sheet .a5-foot{border-top:.8pt solid #B9CAD1;margin-top:9pt;padding-top:5pt;font-size:7.4pt;color:#666;line-height:1.4}
#a5sheet .a5-cols{display:grid;grid-template-columns:1fr 1fr;gap:9pt}
</style>
<style id="pageRule">@page{ size:A4; margin:14mm }</style>
</head>

<header class="topbar">
  <div class="topbar-in">

<script>
/* =====================================================================
   IOL 내비게이터 — 근거 기반 인공수정체 선택 보조 엔진
   Evidence-based intraocular lens selection support engine
   ===================================================================== */
"use strict";

/* ------------------------------------------------------------------
   근거 수준 (Evidence grade)
   A  체계적 문헌고찰 / 메타분석 / RCT
   B  국제 표준(ISO/ANSI) · 대규모 관찰연구
   C  소규모·후향적 관찰연구 (수치 cut-off 재현성 제한)
   D  전문가 합의 · 종설 · 임상 관행 (정량적 cut-off 근거 부족)
   ------------------------------------------------------------------ */

const REFS = {
  R1:{ n:"Cochrane 2016 — 다초점 vs 단초점 IOL", en:"Cochrane 2016 — Multifocal vs monofocal IOLs",
       cite:"de Silva SR, Evans JR, et al. Cochrane Database Syst Rev. 2016;12:CD003169.",
       key:"안경 의존도 감소 RR 0.63 (95% CI 0.55–0.73, 근거수준 low) · 눈부심(glare) RR 1.41 (1.03–1.93, low) · 헤일로(halo) RR 3.58 (1.99–6.46, moderate)",
       keyEn:"Spectacle dependence RR 0.63 (0.55–0.73, low certainty); glare RR 1.41 (1.03–1.93, low); halo RR 3.58 (1.99–6.46, moderate)",
       url:"https://pubmed.ncbi.nlm.nih.gov/27943250/", grade:"A" },
  R2:{ n:"Eye 2025 — enhanced monofocal 메타분석", en:"Eye 2025 — Enhanced vs monofocal meta-analysis",
       cite:"Visual and patient-reported outcomes of enhanced versus monofocal IOLs. Eye (Lond). 2025.",
       key:"중간거리 DCIVA −0.11 logMAR (−0.13~−0.10), 근거리 DCNVA −0.12 (−0.17~−0.07) ≈ 각 1줄 개선 · 원거리 CDVA 차이 없음(high certainty) · 광학현상 OR 1.13 (0.79–1.63, 단초점과 동등) · 중간거리 탈안경 OR 7.85 (4.08–15.09)",
       keyEn:"DCIVA −0.11 logMAR, DCNVA −0.12 (≈1 line each); CDVA no difference (high certainty); troublesome photic phenomena OR 1.13 (0.79–1.63); intermediate spectacle independence OR 7.85",
       url:"https://www.nature.com/articles/s41433-025-03625-4", grade:"A" },
  R3:{ n:"ISO 11979-7:2024 — 동시시 IOL 분류 표준", en:"ISO 11979-7:2024 — SVIOL classification",
       cite:"ISO 11979-7:2024 Ophthalmic implants — Intraocular lenses — Part 7: Clinical investigations.",
       key:"동시시 IOL(SVIOL)을 MIOL / EDOF / FVR 3군으로 규정 · EDOF: 0.20 logMAR 기준 음의 탈초점 범위가 단초점 대조군보다 ≥0.5 D 넓을 것 · FVR: DCIVA·DCNVA 모두 ≤0.20 logMAR · 전 군 공통 단안 암소시 대비감도 변화 ≤0.3 log unit",
       keyEn:"Defines MIOL / EDOF / FVR. EDOF: negative defocus range at 0.20 logMAR ≥0.5 D greater than monofocal control. FVR: DCIVA and DCNVA both ≤0.20 logMAR. Mesopic contrast sensitivity change ≤0.3 log unit.",
       url:"https://www.ophthalmologytimes.com/view/iso-issues-new-standards-for-presbyopia-correcting-iol-classification", grade:"B" },
  R4:{ n:"ANSI Z80.35 — EDOF 정의 기준 (AAO task force)", en:"ANSI Z80.35 — EDOF criteria",
       cite:"AAO/ASCRS/ANSI Z80.35 EDOF task force criteria. (EyeWiki 요약)",
       key:"EDOF 표방 요건: ≥100안 대조연구 · 0.2 logMAR에서 단안 초점심도가 단초점 대비 ≥0.5 D · 66 cm 명소시 중간거리 시력이 통계적으로 우월 · ≥50%가 66 cm에서 ≤0.2 logMAR · 원거리 시력 비열등",
       keyEn:"≥100 eyes with matched controls; monocular depth of focus ≥0.5 D beyond monofocal at 0.2 logMAR; superior mean 66 cm photopic intermediate VA; ≥50% of eyes ≤0.2 logMAR at 66 cm; non-inferior distance VA",
       url:"https://eyewiki.org/Extended_Depth_of_Focus_IOLs", grade:"B" },
  R5:{ n:"ESCRS Functional Vision WG — 기능적 분류", en:"ESCRS Functional Vision WG — functional classification",
       cite:"Ribeiro F, et al. Evidence-based functional classification of simultaneous vision IOLs. J Cataract Refract Surg. 2024;50(8):794–798.",
       key:"탈초점 곡선 기반 분류 — 부분 시야범위(Partial ROF): narrow(표준 단초점) / enhanced(monofocal-plus = 프리미엄 단초점) / extended(EDOF), 전 시야범위(Full ROF): continuous·smooth·steep transition. ‘프리미엄 단초점’은 EDOF가 아니라 enhanced 군",
       keyEn:"Defocus-curve based: Partial ROF (narrow = standard monofocal / enhanced = monofocal-plus / extended = EDOF) and Full ROF (continuous, smooth, steep transition). Enhanced monofocals are NOT EDOF.",
       url:"https://www.escrs.org/channels/eurotimes-articles/sorting-out-simultaneous-vision-iols", grade:"B" },

/* ------------------------------------------------------------------
   비급여 비용 — 연세솔안과 기준, **단안**, 환자 부담 (단위: 만원)

   예전에는 렌즈마다 0~3 짜리 '비용' 척도를 손으로 매겨 두고 그것으로
   감점했다. 실제 금액을 알게 된 이상 그 척도는 두 개의 진실을 만들 뿐이라
   없앴다. 점수도, 화면에 찍히는 금액도 모두 이 표 하나에서 나온다.

   · 토릭은 별개의 축이라 렌즈 종류마다 더해지는 고정 금액으로 다룬다
     (토릭 단초점 100 − 논토릭 단초점 25 = 75).
   · 미니모노비전은 단초점 두 개를 쓰는 것이므로 단안 기준 금액이 같다.
   · 병원이 상담 화면에서 고치면 이 값 대신 그 값이 쓰인다(브라우저에만 저장).
   · 금액은 낡는다. 바뀌면 여기와 상담 화면 둘 중 하나만 고쳐도 되지만,
     저장소 값을 고치는 편이 모든 기기에 반영된다.
   ------------------------------------------------------------------ */
const COST_DEFAULT_MAN = {
  mono:      {min:25,  max:25},
  monoBlend: {min:25,  max:25},
  enhMono:   {min:100, max:150},

/* 실제로 쓰이는 금액표. 병원이 값을 바꾸면 UI 가 이 객체를 갈아끼운다. */
let COST_MAN = JSON.parse(JSON.stringify(COST_DEFAULT_MAN));
function setCostTable(o){ COST_MAN = Object.assign(JSON.parse(JSON.stringify(COST_DEFAULT_MAN)), o || {}); }
/* 점수 계산에는 범위의 중앙값을 쓴다 */
function costMid(id){
  const c = COST_MAN[id];
  return c ? (Number(c.min) + Number(c.max)) / 2 : null;
}

};

  ko:{t:"각막부종을 동반한 푹스이상증", why:"부종된 각막은 그 자체로 빛을 산란시켜 대비감도를 떨어뜨리고, 향후 내피이식(DMEK/DSAEK)이 필요해지면 굴절값이 다시 이동합니다. 초점심도를 나누는 렌즈는 이 위에서 성능을 보장할 수 없습니다.", act:"단초점을 권장하고, 내피이식 병행 또는 단계적 시행을 상의하세요."},
  en:{t:"Fuchs dystrophy with corneal oedema", why:"An oedematous cornea scatters light and lowers contrast on its own, and a future endothelial graft (DMEK/DSAEK) will shift the refraction again. No focus-splitting lens can be relied on over that.", act:"Recommend a monofocal and discuss combined or staged endothelial keratoplasty."},
  refs:["R19"], grade:"D", tests:[T.ENDO]
},
{
  id:"rk", layer:"stop",
  targets:["lentis","trifocal"],
  when:d => d.priorRefSx === "rk",
  ko:{t:"방사상각막절개(RK) 과거력", why:"RK 각막은 하루 중에도 굴절력이 변동하고(diurnal shift) 다구역·불규칙 광학을 가집니다. 도수 예측 오차가 커서 회절형 렌즈의 초점 배치를 신뢰할 수 없습니다.", act:"단초점을 기본으로 검토하고, 잔여 굴절 이상 교정 계획(안경·추가 시술)을 미리 상의하세요. 하루 중 굴절 변동이 큰 만큼 목표 굴절값도 보수적으로 잡습니다."},
  en:{t:"Prior radial keratotomy", why:"An RK cornea shifts refraction through the day and is multizonal and irregular. Power prediction error is large, so the focal placement of a diffractive optic cannot be trusted.", act:"Default to a monofocal and plan in advance for residual refractive error; set a conservative refractive target given the diurnal shift."},
  refs:["R9","R18"], grade:"C", tests:[T.TOPO, T.ABERRO, T.POSTREF]
},
{
  id:"zonule_unstable", layer:"stop",
  targets:["edof","lentis","trifocal","monoBlend"],
  when:d => d.zonule === "phacodonesis",
  ko:{t:"소대 불안정 · 수정체진탕", why:"모든 초점분할 광학과 토릭 광학은 정확한 중심화와 회전 안정성을 전제로 합니다. 소대가 불안정하면 렌즈가 편심·기울어지고 그 즉시 설계된 광학이 무너집니다.", act:"낭내고리(CTR) 등 지지 계획을 먼저 세우고, 중심화 안정성이 확보된 뒤에만 프리미엄 옵션을 논의하세요."},
  en:{t:"Zonular instability / phacodonesis", why:"Every focus-splitting and toric optic assumes accurate centration and rotational stability. Unstable zonules cause decentration and tilt, which immediately destroys the designed optics.", act:"Plan capsular support (CTR) first; discuss premium options only once centration stability is assured."},
  refs:["R13","R19"], grade:"D", tests:[T.DILAT]
},
{
  id:"zonule_unstable_enh", layer:"caution",
  targets:{enhMono:2.5},
  when:d => d.zonule === "phacodonesis",
  ko:{t:"소대 불안정에서의 프리미엄 단초점", why:"프리미엄 단초점의 중간거리 확장은 정밀하게 설계된 전면 비구면 프로파일에서 나오며, 이 효과는 렌즈가 낭 안에서 중심을 유지할 때만 성립합니다. 소대가 약하면 모양체고랑(sulcus) 고정이나 공막고정이 필요해질 수 있고 그때는 이 설계를 쓸 수 없습니다.", act:"중심화가 확실히 보장되는 경우에만 고려하고, 그렇지 않다면 표준 단초점(필요 시 3-piece)으로 계획하세요."},
  en:{t:"Enhanced monofocal with unstable zonules", why:"The intermediate extension of an enhanced monofocal comes from a precisely designed anterior aspheric profile that only works with the lens centred in the bag. Weak zonules may force sulcus placement or scleral fixation, where this design cannot be used.", act:"Consider only if centration is assured; otherwise plan a standard monofocal, 3-piece if needed."},
  refs:["R13","R19"], grade:"D", tests:[T.DILAT]
},
{
  id:"uveitis", layer:"stop",
  targets:["lentis","trifocal"],
  when:d => !!d.uveitis,
  ko:{t:"만성 · 재발성 포도막염", why:"반복되는 염증은 후낭혼탁, 낭수축, 렌즈 표면 침착, 낭포황반부종을 일으켜 회절 광학의 성능을 예측할 수 없게 만듭니다. 안저 관찰도 자주 필요합니다.", act:"염증을 최소 3개월 이상 완전히 조절한 뒤 단초점 계열로 계획하세요."},
  en:{t:"Chronic or recurrent uveitis", why:"Recurrent inflammation causes posterior capsule opacification, capsular contraction, lens surface deposits and cystoid macular oedema, all of which make diffractive performance unpredictable. Frequent fundus review is also needed.", act:"Achieve at least 3 months of quiescence and plan a monofocal-class lens."},
  refs:["R19"], grade:"D", tests:[T.OCT]
},
{
  id:"expectation", layer:"stop",
  targets:["lentis","trifocal"],
  when:d => d.perfectionism === 3 && d.dysphTolerance === 0,
  ko:{t:"완벽한 시력을 요구하면서 빛번짐은 전혀 감내 못 하는 조합", why:"이 조합은 회절형 렌즈에서 구조적으로 충족될 수 없습니다. 렌즈가 정상 작동해도 헤일로는 발생하며, 신경적응 실패는 대개 6개월 안에 드러나고 결국 렌즈 교환으로 이어지기도 합니다(평균 15개월).", act:"기대치 상담을 먼저 진행하세요. 원거리 단초점 또는 프리미엄 단초점처럼 예측 가능한 결과를 주는 선택이 훨씬 안전합니다."},
  en:{t:"Demands perfect vision but tolerates no halo", why:"This combination cannot be satisfied by a diffractive optic. Halos occur even when the lens performs exactly as designed; neuroadaptation failure usually declares itself within 6 months and sometimes ends in exchange (mean 15 months).", act:"Address expectations first. A predictable monofocal or enhanced monofocal result is far safer."},
  refs:["R15","R12","R1"], grade:"D", tests:[T.COUNSEL]
},
{
  id:"precision_near", layer:"stop",
  targets:["lentis","trifocal"],
  when:d => !!d.precisionNearWork,
  ko:{t:"현미경 · 확대경 · 정밀 근업이 직업의 핵심", why:"이 직군은 대비감도와 입체적 이미지 선명도가 생계와 직결됩니다. 문헌에서 다초점을 삽입하지 않는 대표 직군으로 거론됩니다.", act:"단초점(원거리) + 정밀 작업용 안경, 또는 프리미엄 단초점을 권장합니다."},
  en:{t:"Microscope, magnifier or precision near-work is central to the job", why:"Contrast sensitivity and crisp stereoscopic detail are livelihood-critical here. The literature names this group as one in which multifocals are not implanted.", act:"Monofocal for distance plus task-specific spectacles, or an enhanced monofocal."},
  refs:["R12"], grade:"D", tests:[]
},

/* ============ CAUTION ============ */
{
  id:"cornea_irregular_edof", layer:"caution",
  targets:{edof:2},
  when:d => ["kc_progressive","scar","graft"].includes(d.cornea) || d.irregularAstig === true || d.priorRefSx === "rk",
  ko:{t:"불규칙 각막에서의 연속초점 EDOF", why:"연속초점 렌즈는 회절 링이 없어도 초점심도를 늘리기 위해 파면을 다듬습니다. 각막이 이미 불규칙하면 그 위에 얹힌 설계가 의도대로 작동하지 않고, 결과를 예측하기 어렵습니다.", act:"금기는 아니지만, 각막이 안정되고 규칙적임을 확인한 뒤에만 개별적으로 검토하세요. 확신이 없으면 단초점이 안전합니다."},
  en:{t:"Continuous-range EDOF in an irregular cornea", why:"Even without diffractive rings, a continuous-range optic shapes the wavefront to extend depth of focus. Over an already irregular cornea that design does not behave as intended and the outcome is hard to predict.", act:"Not a contraindication, but consider it only once the cornea is confirmed stable and regular. When in doubt a monofocal is safer."},
  refs:["R9","R18"], grade:"D", tests:[T.TOPO, T.ABERRO]
},
{
  id:"macula_early", layer:"caution",
  targets:{trifocal:3, lentis:2.5, edof:1},
  when:d => ["drusen","amd_intermediate","erm_mild"].includes(d.macula),
  ko:{t:"초기 황반 변화 (드루젠 · 중기 건성 황반변성 · 경미한 망막앞막)", why:"현재 시력이 좋아도 이 소견은 진행할 수 있고, 진행 시 회절형 렌즈의 대비감도 손실이 되돌릴 수 없는 문제가 됩니다. 향후 항VEGF 주사나 유리체수술이 필요해질 가능성도 함께 고려해야 합니다.", act:"진행 위험을 환자와 명시적으로 공유하고, 대비감도를 덜 희생하는 선택(프리미엄 단초점 · 비회절 EDOF)으로 무게를 옮기세요."},
  en:{t:"Early macular change (drusen, intermediate dry AMD, mild ERM)", why:"Acuity may be good today, but these findings can progress, and if they do the contrast loss of a diffractive optic becomes an irreversible problem. Future anti-VEGF or vitreoretinal surgery must also be weighed.", act:"Share the progression risk explicitly and shift toward options that sacrifice less contrast (enhanced monofocal, non-diffractive EDOF)."},
  refs:["R19","R11"], grade:"D", tests:[T.OCT, T.MACSTAB]
},
{
  id:"glaucoma_early", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:0.5},
  when:d => ["suspect","mild"].includes(d.glaucoma),
  ko:{t:"녹내장 의증 · 초기 녹내장", why:"조절이 잘 되는 초기 녹내장에서는 프리미엄 IOL이 금기가 아닙니다. 다만 녹내장은 대비감도를 먼저 침범하므로, 향후 진행 가능성을 감안하면 대비감도 여유를 남겨 두는 편이 안전합니다.", act:"EDOF는 다초점보다 대비감도 보존이 낫습니다. 진행 속도와 예상 여명을 함께 고려해 결정하세요."},
  en:{t:"Glaucoma suspect or early glaucoma", why:"Premium IOLs are not contraindicated in well-controlled early disease, but glaucoma attacks contrast first, so leaving contrast headroom is prudent given the possibility of progression.", act:"EDOF preserves contrast better than a multifocal. Weigh rate of progression against life expectancy."},
  refs:["R11"], grade:"D", tests:[T.VF]
},
{
  id:"npdr", layer:"caution",
  targets:{trifocal:2.5, lentis:2, edof:1},
  when:d => d.dr === "npdr",
  ko:{t:"비증식성 당뇨망막병증", why:"당뇨망막병증은 진행성 질환입니다. 지금은 황반부종이 없더라도 향후 부종·레이저·주사 치료가 필요해질 수 있고, 그때 회절형 렌즈는 대비감도와 안저 관찰 양쪽에서 불리해집니다.", act:"혈당 조절 상태와 망막병증 등급을 확인하고, 진행 시나리오를 상담에 포함하세요."},
  en:{t:"Non-proliferative diabetic retinopathy", why:"DR is progressive. Even without oedema today, future oedema, laser or injections are possible, and a diffractive optic is then a liability for both contrast and fundus view.", act:"Confirm glycaemic control and retinopathy grade, and include the progression scenario in counselling."},
  refs:["R12","R19"], grade:"D", tests:[T.OCT, T.MACSTAB]
},
{
  id:"guttata", layer:"caution",
  targets:{trifocal:2.5, lentis:2, edof:1},
  when:d => d.cornea === "guttata",
  ko:{t:"각막 구타타 (부종 없음)", why:"구타타는 그 자체로 빛산란을 늘려 대비감도를 낮추고, 백내장 수술의 내피 스트레스 이후 부종으로 진행할 수 있습니다. 내피세포수가 낮을수록 위험이 큽니다.", act:"내피세포 검사와 중심각막두께를 확인하고, 수치가 경계적이면 회절형을 피하세요."},
  en:{t:"Corneal guttata without oedema", why:"Guttata increases light scatter and lowers contrast on its own, and can decompensate after the endothelial stress of surgery. Risk rises as endothelial cell count falls.", act:"Check specular microscopy and central corneal thickness; avoid diffractive optics if borderline."},
  refs:["R19"], grade:"D", tests:[T.ENDO]
},
{
  id:"kc_stable", layer:"caution",
  targets:{trifocal:3, lentis:2, edof:1.5},
  when:d => d.cornea === "kc_stable",
  ko:{t:"안정된 원추각막 · forme fruste", why:"안정적이어도 각막 고위수차가 정상보다 크고, 향후 진행 가능성이 완전히 사라진 것은 아닙니다. 도수 계산 오차도 큽니다.", act:"수차 수치를 직접 확인하고, 진행이 없음을 여러 시점의 지형도로 확인하세요."},
  en:{t:"Stable keratoconus or forme fruste", why:"Even when stable, corneal higher-order aberrations exceed normal and progression is not fully excluded. Power calculation error is also larger.", act:"Measure the aberrations directly and confirm stability on serial topography."},
  refs:["R13","R18"], grade:"C", tests:[T.TOPO, T.ABERRO]
},
{
  id:"ebmd", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:1, enhMono:0.5},
  when:d => d.cornea === "ebmd",
  ko:{t:"전기저막이상증 (EBMD)", why:"불규칙한 상피가 각막 계측을 왜곡하고 시질을 변동시킵니다. 치료 가능한 원인이므로 계측 전에 해결하는 것이 원칙입니다.", act:"필요 시 상피박리(superficial keratectomy) 후 각막이 안정된 뒤 계측을 다시 하세요."},
  en:{t:"Epithelial basement membrane dystrophy", why:"An irregular epithelium distorts keratometry and makes vision fluctuate. It is treatable, so it should be addressed before biometry.", act:"Consider superficial keratectomy, then repeat biometry once the surface is stable."},
  refs:["R10","R8"], grade:"D", tests:[T.TOPO, T.OSD]
},
{
  id:"osd_mild", layer:"caution",
  targets:{trifocal:1.5, lentis:1.2, edof:1, enhMono:0.5},
  when:d => d.osd === "mild",
  ko:{t:"경미한 안구표면질환", why:"수술 자체가 건성안을 일시적으로 악화시킵니다. 프리미엄 렌즈에 대한 술후 불만의 상당수는 렌즈가 아니라 눈물막 때문이며, 이는 치료 가능한 원인입니다.", act:"술전에 안구표면을 적극적으로 최적화하고, 술후 건성안 악화 가능성을 미리 설명하세요."},
  en:{t:"Non-visually-significant ocular surface disease", why:"Surgery itself transiently worsens dry eye. A large share of premium-IOL dissatisfaction traces to the tear film rather than the lens — and that cause is treatable.", act:"Optimise the surface pre-operatively and warn the patient about transient post-operative worsening."},
  refs:["R10"], grade:"B", tests:[T.OSD]
},
{
  id:"prior_lvc", layer:"caution",
  targets:{trifocal:2.5, lentis:1.5, edof:0.5},
  when:d => ["myopic_lvc","hyperopic_lvc"].includes(d.priorRefSx),
  ko:{t:"라식 · 라섹 · 스마일 과거력", why:"과거력 자체는 절대 금기가 아닙니다. 다만 각막이 다구역이 되어 고위수차와 구면수차가 변하고, IOL 도수 예측 오차가 커집니다. 이 환자군은 기대치도 높습니다. 후향 분석에서 HOA <0.5 µm @6 mm, 구면수차 <0.6 µm를 넘긴 경우 불만족이 늘었습니다.", act:"수차를 실제로 측정해 위 기준과 대조하고, 굴절수술 후 전용 계산식(Barrett True-K 등)을 사용하며, 잔여 굴절 이상 교정 계획을 미리 합의하세요."},
  en:{t:"Prior LASIK / PRK / SMILE", why:"A history of LVC is not an absolute contraindication, but the cornea becomes multizonal with altered HOA and spherical aberration, and IOL power prediction error rises. Expectations in this group are high. In a retrospective series, exceeding HOA 0.5 µm at 6 mm or SA 0.6 µm was associated with dissatisfaction.", act:"Measure the aberrations against those thresholds, use post-LVC formulas (e.g. Barrett True-K), and agree a plan for residual refractive error in advance."},
  refs:["R9","R8"], grade:"C", tests:[T.ABERRO, T.TOPO, T.POSTREF, T.COUNSEL]
},
{
  id:"chord_high", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:0.5},
  when:d => (num(d.chordAlpha) !== null && d.chordAlpha >= 0.6) || (num(d.chordMu) !== null && d.chordMu >= 0.6),
  ko:{t:"Chord mu / alpha ≥ 0.6 mm", why:"동공 중심과 시축이 크게 어긋나면 회절 링에 대해 렌즈가 상대적으로 편심된 것처럼 작동해 광학현상이 늘 수 있습니다. 다만 근거는 상충합니다 — 26,470안 자료에서는 술전 angle kappa와 술후 결과 사이에 임상적으로 유의한 관계가 없었고, 장비 간 값 차이도 큽니다(동일 안에서 0.27 vs 0.43 mm).", act:"이 값 하나로 결정하지 마세요. 각막지형도상 동공 중심 대비 시축 위치를 직접 보고, 다른 위험인자와 합쳐서 판단하세요."},
  en:{t:"Chord mu / alpha ≥ 0.6 mm", why:"A large offset between pupil centre and visual axis makes the lens behave as if decentred relative to its diffractive rings, potentially increasing dysphotopsia. The evidence conflicts: in 26,470 eyes preoperative angle kappa showed no clinically meaningful relationship to outcomes, and devices disagree markedly (0.27 vs 0.43 mm in the same eye).", act:"Do not decide on this value alone. Inspect the visual-axis position on topography and weigh it alongside other risk factors."},
  refs:["R6"], grade:"C", tests:[T.KAPPA, T.TOPO]
},
{
  id:"chord_border", layer:"caution",
  targets:{trifocal:1, lentis:0.7},
  when:d => {
    const a = num(d.chordAlpha), m = num(d.chordMu);
    const hi = (a !== null && a >= 0.6) || (m !== null && m >= 0.6);
    if (hi) return false;
    return (a !== null && a >= 0.5) || (m !== null && m >= 0.5);
  },
  ko:{t:"Chord mu / alpha 0.5–0.6 mm (경계 구간)", why:"관행적으로 인용되는 회피 기준(0.5–0.6 mm)의 경계에 있습니다. 이 구간의 근거는 약하며 기기 의존적입니다.", act:"측정 기기를 기록하고 가능하면 다른 장비로 교차 확인하세요. 단독 배제 근거로는 부족합니다."},
  en:{t:"Chord mu / alpha 0.5–0.6 mm (borderline)", why:"This sits at the boundary of the conventionally cited 0.5–0.6 mm avoid-threshold. The evidence for this band is weak and device-dependent.", act:"Record the device and cross-check on a second platform if possible. Not sufficient grounds for exclusion on its own."},
  refs:["R6"], grade:"C", tests:[T.KAPPA]
},
{
  id:"hoa_high", layer:"caution",
  targets:{trifocal:2.5, edof:1}, boost:{lentis:0.8},
  when:d => {
    const v = num(d.hoaRMS); if (v === null) return false;
    return d.hoaZone === "6" ? v > 0.5 : v > 0.3;
  },
  ko:{t:"각막 고위수차가 통상 기준을 초과", why:"HOA 0.3 µm @4 mm는 약 0.5 D 탈초점에 해당하는 흐림을 만듭니다. 각막이 이미 상당한 수차를 가지면 회절형 렌즈가 만드는 이미지 질을 예측하기 어렵습니다. 다만 이 cut-off의 근거는 제한적입니다 — 원 저자도 “실질적 가이드라인은 없다”고 명시했고, 378명 분석에서 HOA와 만족도의 상관은 없었습니다.", act:"수치 하나로 배제하지 말고 지형도 패턴, 나안 시력, 다른 위험인자와 함께 종합하세요. 기준: 4 mm에서 0.3 µm, 6 mm에서 0.5 µm."},
  en:{t:"Corneal higher-order aberrations above the conventional threshold", why:"HOA of 0.3 µm at 4 mm produces blur equivalent to about 0.5 D of defocus. When the cornea already carries substantial aberration, diffractive image quality becomes hard to predict. But this cut-off is weakly supported — the originating author states there are 'no real guidelines', and in 378 patients HOA did not correlate with satisfaction.", act:"Do not exclude on the number alone; combine it with the topographic pattern, uncorrected acuity and other risk factors. Thresholds: 0.3 µm at 4 mm, 0.5 µm at 6 mm."},
  refs:["R7","R8","R9"], grade:"C", tests:[T.ABERRO]
},
{
  id:"coma_high", layer:"caution",
  targets:{trifocal:2.5, edof:0.8}, boost:{lentis:1.2},
  when:d => num(d.cornealComa) !== null && d.cornealComa > 0.3,
  ko:{t:"각막 코마 > 0.3 µm @6 mm", why:"코마는 비대칭 수차로, 회절형 렌즈의 초점 분리와 겹치면 잔상·꼬리끌림 형태의 광학현상으로 나타나기 쉽습니다. 원추각막·편심 절제·이식 후 각막에서 흔합니다.", act:"원인(확장증·편심 절제·이식)을 먼저 규명하세요. 노안교정을 원하는 환자라면, 회절 링이 없는 굴절형 분절 이중초점(렌티스)이 회절형보다 코마를 덜 증폭한다고 보아 이 진료에서는 그쪽을 씁니다 — 비교 임상시험이 아니라 임상 관행에 따른 선택입니다."},
  en:{t:"Corneal coma > 0.3 µm at 6 mm", why:"Coma is an asymmetric aberration; combined with the focal separation of a diffractive optic it tends to produce comet-tail smearing. It is common in keratoconus, decentred ablations and grafts.", act:"Identify the cause (ectasia, decentred ablation, graft) first. For a patient who still wants presbyopia correction, this practice uses a segmented refractive bifocal (LENTIS), on the view that without diffractive rings it amplifies coma less — a practice-based choice rather than one from a comparative trial."},
  refs:["R8","R18"], grade:"C", tests:[T.ABERRO, T.TOPO]
},
{
  id:"pupil_meso_large", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:0.5},
  when:d => num(d.pupMesopic) !== null && d.pupMesopic >= 6.0,
  ko:{t:"암소시 동공 ≥ 6.0 mm", why:"야간에 동공이 크게 열리면 회절 구조의 바깥 영역과 각막 주변부 수차까지 동원되어 헤일로·글레어·스타버스트가 커집니다. 야간 운전 요구가 함께 높으면 위험이 곱해집니다.", act:"야간 광학현상 가능성을 구체적으로 설명하고, 야간 요구가 높다면 비회절 설계로 무게를 옮기세요."},
  en:{t:"Mesopic pupil ≥ 6.0 mm", why:"A widely dilated pupil at night recruits the outer diffractive zones and peripheral corneal aberrations, enlarging halo, glare and starburst. Risk multiplies when night-driving demand is also high.", act:"Counsel concretely about night-time phenomena and shift toward non-diffractive designs if night demand is high."},
  refs:["R8","R1"], grade:"C", tests:[T.PUPIL]
},
{
  id:"pupil_photo_small", layer:"caution",
  targets:{trifocal:1.5, lentis:1.5, edof:0.3},
  when:d => num(d.pupPhotopic) !== null && d.pupPhotopic < 2.5,
  ko:{t:"명소시 동공 < 2.5 mm", why:"동공이 작으면 바깥쪽 근거리 영역이 가려져 설계된 근거리 성능이 나오지 않을 수 있습니다. 회절형은 바깥 링이, 굴절형 분절 렌즈(렌티스)는 아래쪽 근거리 섹터가 가려지는 형태로 나타납니다.", act:"해당 렌즈의 동공 의존성을 확인하고, 동공 비의존 설계를 우선 고려하세요."},
  en:{t:"Photopic pupil < 2.5 mm", why:"A small pupil masks the outer near-addition zones, so the designed near performance may not be realised — the outer rings in a diffractive optic, or the inferior near sector in a segmented refractive lens (LENTIS).", act:"Check the pupil dependence of the specific lens and favour pupil-independent designs."},
  refs:["R8","R18"], grade:"C", tests:[T.PUPIL]
},
{
  id:"astig_uncorrected", layer:"caution",
  targets:{trifocal:3, lentis:2.5, edof:2, enhMono:1.5, monoBlend:1},
  when:d => num(d.cylD) !== null && d.cylD >= 0.75 && d.toricPlanned !== true,
  ko:{t:"각막난시 ≥ 0.75 D인데 난시교정 계획이 없음", why:"잔여 난시는 초점분할 렌즈의 이미 얇은 이미지 질 여유를 그대로 잠식합니다. 프리미엄 렌즈 술후 불만의 가장 흔하고 가장 교정 가능한 원인입니다. 각막난시 ≥1.0 D에서는 토릭이 보편적으로 권고되며, 술후 정규난시는 1.0 D 미만으로 유지하는 것이 목표입니다.", act:"토릭 IOL 또는 각막이완절개를 함께 계획하세요. 난시를 교정하지 않을 것이라면 프리미엄 렌즈 자체를 재고해야 합니다."},
  en:{t:"Corneal astigmatism ≥ 0.75 D with no astigmatic correction planned", why:"Residual cylinder consumes the already-thin image-quality margin of a focus-splitting lens. It is the most common and most correctable cause of premium-IOL dissatisfaction. Toric IOLs are universally recommended at ≥1.0 D, and postoperative regular astigmatism should stay below 1.0 D.", act:"Plan a toric IOL or limbal relaxing incisions. If astigmatism will not be corrected, reconsider the premium lens itself."},
  refs:["R13","R8","R12"], grade:"C", tests:[T.TCA, T.TOPO]
},
{
  id:"al_long", layer:"caution",
  targets:{trifocal:1.5, lentis:1.2, edof:0.8},
  when:d => num(d.al) !== null && d.al >= 26.0,
  ko:{t:"긴 안축장 (고도근시)", why:"안축장 26 mm 초과에서 술후 망막박리 위험이 0.9–3.8%, 33.6–35.5 mm에서는 11%까지 보고됩니다. 근시성 망막변성이 최종시력을 제한하는 독립 인자이며, 도수 예측 오차도 큽니다. 향후 유리체망막 수술 시 안저 관찰이 필요합니다.", act:"주변부 망막을 산동 후 반드시 확인하고, 황반 OCT로 근시성 변화를 평가하세요. 망막박리 위험을 명시적으로 상담하세요."},
  en:{t:"Long axial length (high myopia)", why:"Retinal detachment risk after surgery is 0.9–3.8% above 26 mm and up to 11% at 33.6–35.5 mm. Myopic degeneration independently limits final acuity, and power prediction error is larger. Future vitreoretinal surgery would require a clear fundus view.", act:"Examine the peripheral retina dilated and assess myopic macular change on OCT. Counsel explicitly about detachment risk."},
  refs:["R14"], grade:"C", tests:[T.OCT, T.BIOM, T.MACSTAB]
},
{
  id:"al_short", layer:"caution",
  targets:{trifocal:1.5, lentis:1.2, edof:1},
  when:d => num(d.al) !== null && d.al < 22.0,
  ko:{t:"짧은 안축장", why:"짧은 눈에서는 유효렌즈위치(ELP) 예측 오차가 커져 목표 굴절값에서 벗어날 확률이 높습니다. 초점이 정확히 놓여야 성능이 나오는 회절형 렌즈에서는 이 오차가 바로 불만족으로 이어집니다.", act:"짧은 눈에 최적화된 최신 계산식을 사용하고, 필요 시 술후 굴절 이상 교정 계획을 미리 합의하세요."},
  en:{t:"Short axial length", why:"Effective lens position is harder to predict in short eyes, so refractive outcomes scatter more. A diffractive optic depends on accurate focal placement, so that scatter translates directly into dissatisfaction.", act:"Use a formula optimised for short eyes and agree a plan for residual refractive error."},
  refs:["R14","R16"], grade:"C", tests:[T.BIOM]
},
{
  id:"ifis", layer:"caution",
  targets:{trifocal:1, lentis:1.2, edof:0.5},
  when:d => !!d.ifis,
  ko:{t:"IFIS 위험 또는 산동 불량", why:"수술 중 홍채이완증후군은 낭절개 크기와 렌즈 중심화의 정확도를 떨어뜨립니다. 초점분할·토릭 광학은 중심화와 회전 안정성에 민감합니다.", act:"산동 보조 기구와 IFIS 대비 계획을 미리 준비하세요. 중심화 확신이 없다면 프리미엄 선택을 재고하세요."},
  en:{t:"IFIS risk or poor dilation", why:"Intraoperative floppy iris syndrome degrades the accuracy of capsulotomy sizing and lens centration, and focus-splitting and toric optics are sensitive to both centration and rotation.", act:"Prepare pupil-expansion devices and an IFIS plan. Reconsider premium options if centration cannot be assured."},
  refs:["R13"], grade:"D", tests:[T.DILAT]
},
{
  id:"pxf", layer:"caution",
  targets:{trifocal:2, lentis:2, edof:1},
  when:d => d.zonule === "pxf",
  ko:{t:"거짓비늘증후군 (소대 약화 의심)", why:"소대가 약하면 후기 낭수축과 렌즈 편심·기울어짐, 후기 탈구가 생길 수 있습니다. 이 경우 회절 광학과 토릭 축이 모두 무너집니다. 녹내장 동반도 흔합니다.", act:"낭내고리 사용을 검토하고 장기 추적 계획을 세우세요. 녹내장 동반 여부를 반드시 확인하세요."},
  en:{t:"Pseudoexfoliation with suspected weak zonules", why:"Weak zonules risk late capsular contraction, decentration, tilt and late dislocation, all of which destroy both diffractive optics and toric axis. Coexisting glaucoma is common.", act:"Consider a capsular tension ring and plan long-term follow-up. Always check for glaucoma."},
  refs:["R11","R13"], grade:"D", tests:[T.VF, T.DILAT]
},
{
  id:"vitrectomy_other", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:0.8},
  when:d => !!d.vitrectomy,
  ko:{t:"유리체절제술 과거력 또는 향후 필요 가능성", why:"유리체가 없는 눈은 굴절 예측과 렌즈 안정성이 달라지고, 대개 기저 망막질환이 함께 있습니다. 향후 수술 시 선명한 안저 관찰이 필요합니다.", act:"기저 망막 상태와 황반 구조를 확인하고 망막 전문의와 상의하세요."},
  en:{t:"Prior or anticipated vitrectomy", why:"A vitrectomised eye behaves differently for refractive prediction and lens stability, and usually carries underlying retinal disease. Future surgery needs an unobstructed fundus view.", act:"Confirm the underlying retinal status and macular architecture with a retina specialist."},
  refs:["R19"], grade:"D", tests:[T.OCT, T.MACSTAB]
},
{
  id:"unilateral", layer:"caution",
  targets:{trifocal:1.5, lentis:1.5, edof:0.8, monoBlend:2},
  when:d => d.bilateral === "no",
  ko:{t:"한쪽 눈만 수술", why:"동시시 렌즈의 이점은 상당 부분 양안 합산에서 나옵니다. 한쪽만 삽입하면 양안의 이미지 질과 대비가 달라 융합이 어렵고 불편감이 커질 수 있습니다. 미니모노비전은 반대눈 굴절값을 전제로 하므로 성립하지 않습니다.", act:"반대눈의 현재 굴절값·수정체 상태·향후 수술 계획을 확인하고, 양안 계획이 정해진 뒤에 프리미엄을 결정하는 편이 안전합니다."},
  en:{t:"Unilateral surgery", why:"Much of the benefit of simultaneous-vision lenses comes from binocular summation. A single implanted eye creates an interocular mismatch in image quality that can be hard to fuse. Mini-monovision presupposes a known fellow-eye refraction and does not apply.", act:"Establish the fellow eye's refraction, lens status and surgical plan before committing to a premium option."},
  refs:["R19"], grade:"D", tests:[]
},
{
  id:"night_demand", layer:"caution",
  targets:{trifocal:2.5, lentis:1.8, edof:0.8},
  when:d => d.nightDriving === 3 || d.nightWork === true,
  ko:{t:"야간 운전 · 야간 근무가 직업적으로 필수", why:"헤일로는 다초점에서 단초점 대비 약 3.6배 흔합니다(RR 3.58, 95% CI 1.99–6.46). 야간 시력이 생계와 직결되는 경우 이 위험은 취향의 문제가 아니라 안전의 문제입니다.", act:"야간 요구를 가장 앞에 두고 설계하세요. 단초점 + 근거리 안경, 또는 초점을 나누지 않는 설계가 안전합니다."},
  en:{t:"Night driving or night work is occupationally essential", why:"Halos are about 3.6× more common with multifocals (RR 3.58, 95% CI 1.99–6.46). When night vision is livelihood-critical this is a safety question, not a preference.", act:"Design around the night requirement: non-diffractive optics, or a monofocal plus reading glasses."},
  refs:["R1"], grade:"A", tests:[T.PUPIL, T.COUNSEL]
},
{
  id:"expect_high", layer:"caution",
  targets:{trifocal:2, lentis:1.5, edof:0.8},
  when:d => d.perfectionism === 3 && d.dysphTolerance > 0,
  ko:{t:"매우 높은 기대 수준 · 완벽주의 성향", why:"신경적응 실패는 시력이 좋아도 발생하며 대개 6개월 안에 드러납니다. 이 성향에서는 작은 광학현상도 지속적 불만으로 이어지기 쉽습니다.", act:"‘안경을 덜 쓴다’와 ‘완벽한 시질’은 동시에 보장할 수 없다는 점을 술전에 문서화해 설명하세요."},
  en:{t:"Very high expectations / perfectionist temperament", why:"Neuroadaptation failure occurs even with excellent acuity and usually declares itself within 6 months. In this temperament small photic phenomena readily become persistent complaints.", act:"Document preoperatively that 'fewer glasses' and 'flawless image quality' cannot both be guaranteed."},
  refs:["R15","R12"], grade:"D", tests:[T.COUNSEL]
},
{
  id:"young_age", layer:"caution",
  targets:{trifocal:0.8, lentis:0.6},
  when:d => num(d.age) !== null && d.age < 55,
  ko:{t:"비교적 젊은 연령 (< 55세)", why:"남은 기대여명이 길어 향후 황반·녹내장 질환이 발생할 확률이 높고, 그때 렌즈를 되돌리기 어렵습니다. 동공도 더 크고 시각 요구도 까다로운 경향이 있습니다.", act:"장기 시나리오를 상담에 포함하고, 백내장이 아닌 굴절 목적 수술이라면 각막 굴절수술 등 다른 선택지도 비교하세요."},
  en:{t:"Younger patient (< 55 years)", why:"A long remaining lifespan raises the chance of later macular or glaucomatous disease, at which point the lens is hard to undo. Pupils are also larger and visual demands more exacting.", act:"Include the long-term scenario in counselling; if this is refractive rather than cataract surgery, compare corneal refractive options too."},
  refs:["R19","R16"], grade:"D", tests:[]
},

/* ============ NOTE (감점 없음) ============ */
{
  id:"sa_match_aspheric", layer:"note", targets:[],
  when:d => num(d.cornealSA) !== null && d.cornealSA >= 0.1,
  ko:{t:"비구면 IOL 매칭 권고", why:"측정된 각막 구면수차가 0.1 µm 이상이므로 음의 구면수차를 가진 비구면 IOL로 상쇄하는 것이 대비감도에 유리합니다. 모집단 평균은 +0.27 µm @6 mm입니다.", act:"각막 SA 값에 맞춰 IOL 비구면도(−0.20 / −0.27 µm 등)를 선택하세요. 렌즈 종류 선택과는 별개의 축입니다."},
  en:{t:"Match the aspheric IOL to the measured corneal SA", why:"Measured corneal spherical aberration is ≥0.1 µm, so a negative-SA aspheric IOL should be used to offset it. Population mean is +0.27 µm at 6 mm.", act:"Choose IOL asphericity (−0.20 / −0.27 µm) to match. This is a separate axis from the lens category."},
  refs:["R8"], grade:"D", tests:[]
},
{
  id:"sa_match_neutral", layer:"note", targets:[],
  when:d => num(d.cornealSA) !== null && d.cornealSA < 0.1,
  ko:{t:"무수차(aberration-neutral) IOL 권고", why:"각막 구면수차가 0.1 µm 미만입니다. 음의 구면수차 비구면 IOL을 넣으면 과보정되어 오히려 이미지 질이 나빠질 수 있습니다.", act:"구면수차 0에 가까운 무수차 IOL을 선택하세요. 근시 라식 후에는 양의 SA가 증가하고 원시 교정 후에는 음으로 이동하므로 반드시 실측값을 쓰세요."},
  en:{t:"Use an aberration-neutral IOL", why:"Corneal spherical aberration is below 0.1 µm. A negative-SA aspheric IOL would overcorrect and could worsen image quality.", act:"Select an aberration-neutral (SA ≈ 0) IOL. Myopic LVC raises positive SA and hyperopic LVC shifts it negative, so always use the measured value."},
  refs:["R8"], grade:"D", tests:[]
},
{
  id:"lentis_plan", layer:"note", targets:[],

function num(v){
  if (v === null || v === undefined || v === "" ) return null;
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : null;
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* 생활 요구 항목의 '중립값' — 이 값에서는 어느 렌즈에도 가산도 감점도 생기지 않는다.
   (빛번짐 감내는 척도가 뒤집혀 있어 3 이 중립이다) */
const PREF_NEUTRAL = {
  specIndep:0, nearPriority:0, interPriority:0,
  nightDriving:0, dysphTolerance:3, perfectionism:1, costSensitivity:0,
};
const PREF_LABEL = {
  specIndep:      {ko:"안경으로부터 자유롭고 싶은 정도", en:"Desire for spectacle independence"},
  nearPriority:   {ko:"근거리 작업 비중", en:"Near-work demand"},
  interPriority:  {ko:"중간거리 작업 비중", en:"Intermediate demand"},
  nightDriving:   {ko:"야간 운전의 중요도", en:"Night-driving demand"},
  dysphTolerance: {ko:"빛번짐 감내 정도", en:"Tolerance for halo and glare"},
  perfectionism:  {ko:"기대 수준·완벽주의 성향", en:"Expectation level"},
  costSensitivity:{ko:"비용 민감도", en:"Cost sensitivity"},
};

/* 미확인 시 결론에 실질적 영향을 주는 항목 */
const CRITICAL_UNKNOWN = {
  macula:     {tests:["OCT","MACSTAB"], ko:"황반 상태", en:"Macular status"},
  glaucoma:   {tests:["VF"],            ko:"녹내장 유무·중증도", en:"Glaucoma presence and severity"},
  cornea:     {tests:["TOPO","ENDO"],   ko:"각막 상태", en:"Corneal status"},
  osd:        {tests:["OSD"],           ko:"안구표면 상태", en:"Ocular surface status"},
  dr:         {tests:["OCT"],           ko:"당뇨망막병증 유무", en:"Diabetic retinopathy"},
  priorRefSx: {tests:["TOPO","POSTREF"],ko:"이전 각막 굴절수술 여부", en:"Prior corneal refractive surgery"},
  zonule:     {tests:["DILAT"],         ko:"소대 안정성", en:"Zonular stability"},
  astigKnown: {tests:["TCA","TOPO"],    ko:"각막 난시량", en:"Corneal astigmatism"},
  bilateral:  {tests:[],                ko:"양안/단안 수술 계획", en:"Bilateral vs unilateral plan"},

/* 원시 입력 → 엔진 입력 정규화
   mode 에는 역할(patient·counselor·doctor) 또는 데이터 모드(patient·pro)가 들어옵니다.
   d.role 은 화면 구성에, d.mode 는 임상 로직에 쓰입니다. */
function normalize(raw, mode){
  const d = Object.assign({}, raw);
  const role = mode || "patient";
  d.role = role;
  d.mode = (typeof ROLE_DATA_MODE !== "undefined" && ROLE_DATA_MODE[role]) || "pro";

  ["age","cylD","cornealSA","cornealComa","hoaRMS","chordMu","chordAlpha","pupPhotopic","pupMesopic","al"]
    .forEach(k => { d[k] = num(d[k]); });

  /* 생활 요구 항목은 화면에서 미리 골라 두지 않는다. 답하지 않은 항목은
     '요구 없음'이 아니라 '아직 모름'이므로, 어느 쪽으로도 점수를 밀지 않는
     중립값으로 바꾸고 별도로 기록한다. 미입력을 임의의 기본값으로 추론하지
     않는다는 이 도구의 원칙을 선호 항목에도 그대로 적용한 것이다. */
  const prefUnanswered = [];
  Object.entries(PREF_NEUTRAL).forEach(([k, neutral]) => {
    const n = num(d[k]);
    if (n === null){ prefUnanswered.push(k); d[k] = neutral; }
    else d[k] = n;
  });
  d._prefUnanswered = prefUnanswered;

  ["opticNeuro","uveitis","vitrectomy","ifis","irregularAstig","toricPlanned","precisionNearWork","nightWork"]
    .forEach(k => { d[k] = d[k] === true || d[k] === "true"; });

  /* 난시: 실제 계측값(cylD)이 있으면 언제나 그것을 씁니다.
     계측값이 없고 환자·상담 단계의 서술만 있으면 추정하되 '추정'임을 표시합니다.
     (상담직원이 문진만 하고 계측 전이어도 환자 응답이 버려지지 않게 하려는 것) */
  d.astigEstimated = false;
  if (d.cylD === null && d.astigKnown && d.astigKnown !== "unknown"){
    if (d.astigKnown === "no")        d.cylD = 0;
    else if (d.astigKnown === "some"){ d.cylD = 1.0; d.astigEstimated = true; }
    else if (d.astigKnown === "lots"){ d.cylD = 2.0; d.astigEstimated = true; }
  }
  if (d.mode === "patient") d.toricPlanned = false;   // 환자는 수술 계획을 알 수 없음

  // 'unknown' 은 규칙을 발동시키지 않음 (null 취급) — 대신 추가검사로 표시
  const unknowns = [];
  Object.keys(CRITICAL_UNKNOWN).forEach(k => {
    if (d[k] === "unknown"){ unknowns.push(k); d[k] = null; }
  });
  d._unknowns = unknowns;
  return d;
}

/* 선호 적합도 원점수

   설계 원칙: **요구가 있을 때만 점수가 움직인다.**

   이전 판에서는 야간·빛번짐·비용 항목이 양방향으로 작동했다. 즉 환자가 아무 말도
   하지 않은 기본값(4단계 중 1)에서도 야간에 강한 렌즈에 큰 가산점이 붙었고, 그
   결과 "안경을 되도록 안 쓰고 싶다"를 최대로 고른 건강한 눈에서도 프리미엄 단초점
   이나 미니모노비전이 1순위로 나왔다. 기본값은 '특별한 요구 없음'에 가깝지 신호가
   아니므로, 이 세 항목은 이제 **요구가 기본값을 넘을 때만 감점으로** 작동한다.
   반대로 야간 요구가 없다고 해서 야간에 강한 렌즈에 가산점을 주지는 않는다.

   근거리·중간거리·탈안경 요구는 그대로 가산으로 둔다 — 이것들은 환자가 명시적으로
   고른 값이고, 렌즈 선택을 움직여야 하는 신호다. */
function prefBreakdown(d, lens, cost){
  const cap = lens.cap;
  const nightPressure = Math.max(0, d.nightDriving - 1);            // 0..2
  /* 빛번짐 감내는 4단계가 고르게 나뉘지 않는다. 겪어본 적 없는 증상이라 대부분
     '조금은'이나 '웬만큼'을 고르는데, 예전 계산('조금은'=1, 최대의 절반)에서는
     그 한 칸이 회절형에서만 7점을 깎아 결과가 뒤집혔다. '전혀 못 견딘다'는
     여전히 강한 신호로 두되, '조금은'은 가벼운 유보로만 반영한다. */
  const GLARE = [2, 0.5, 0, 0];
  const glarePressure = GLARE[Math.max(0, Math.min(3, Math.round(d.dysphTolerance)))];
  const nightWeak = Math.max(0, 2.6 - cap.night) / 1.6;             // 0(야간 안정) .. 1(취약)

  /* 비용은 실제 금액에서 계산한다. 가장 싼 선택지와의 차이를 가장 비싼 선택지와의
     차이로 나눈 값(0~1)에 비용 민감도를 곱한다.
     야간·빛번짐과 달리 한 칸을 빼지 않는 이유: 이 척도는 '상관없다'가 0번이라
     0 이 이미 '요구 없음'이다. 야간·빛번짐 척도는 중립 지점이 가운데에 있어
     한 칸을 빼야 같은 뜻이 된다. */
  const price = costMid(lens.id);
  const rel = (price === null || !cost || cost.span <= 0)
    ? 0 : Math.max(0, Math.min(1, (price - cost.floor) / cost.span));

  const items = [
    {k:"near",  v:  d.nearPriority  * (cap.near  / 3) * 2.2},
    {k:"inter", v:  d.interPriority * (cap.inter / 3) * 1.7},
    {k:"spec",  v:  d.specIndep     * ((cap.near + cap.inter) / 6) * 2.6},
    {k:"night", v: -nightPressure * nightWeak * 2.4},
    {k:"dysph", v: -glarePressure * nightWeak * 2.0},
    {k:"cost",  v: -d.costSensitivity * rel * 2.4},
    /* 재정 제약이 없고 탈안경 의지가 뚜렷하면 초점 범위가 넓은 쪽을 더 적극적으로
       올려 준다. 두 조건을 함께 요구하는 것이 핵심이다 —
       · '비용 상관없다'만으로는 올리지 않는다. 탈안경을 원하지 않는다고 답한
         환자에게 비싼 렌즈를 권하는 셈이 되기 때문이다.
       · 금액이 아니라 초점 범위(cap.near + cap.inter)에 비례시킨다. 가격 자체가
         추천 사유가 되면, 환자도 보는 화면에서 '비싸서 골랐다'가 된다.
       · 비용을 답하지 않은 경우는 '상관없다'가 아니라 '아직 모름'이라 제외한다. */
    {k:"afford", v: (d.costSensitivity === 0
                     && !(d._prefUnanswered || []).includes("costSensitivity")
                     && d.specIndep >= 2)
                    ? ((cap.near + cap.inter) / 6) * 2.4 : 0},
  ];
  return {items, total: items.reduce((s,i) => s + i.v, 0), price, costRel: rel};
}

function evaluate(raw, mode){
  const d = normalize(raw, mode);

  const state = {};
  LENSES.forEach(l => { state[l.id] = {lens:l, stops:[], cautions:[], boosts:[], penalty:0, boost:0}; });

  const notes = [], fired = [];
  const testSet = new Map();
  const addTest = t => { if (t && !testSet.has(t.ko)) testSet.set(t.ko, t); };

  RULES.forEach(rule => {
    let hit = false;
    try { hit = !!rule.when(d); } catch (e) { hit = false; }
    if (!hit) return;
    fired.push(rule.id);
    (rule.tests || []).forEach(addTest);

    if (rule.layer === "note"){ notes.push(rule); return; }

    if (rule.layer === "stop"){
      const list = Array.isArray(rule.targets) ? rule.targets : Object.keys(rule.targets);
      list.forEach(id => { if (state[id]) state[id].stops.push(rule); });
    } else if (rule.layer === "caution"){
      const map = Array.isArray(rule.targets)
        ? Object.fromEntries(rule.targets.map(t => [t, 1]))
        : rule.targets;
      Object.entries(map).forEach(([id, w]) => {
        if (!state[id]) return;
        state[id].cautions.push({rule, w});
        state[id].penalty += w;
      });
    }
    if (rule.boost){
      Object.entries(rule.boost).forEach(([id, b]) => {
        if (!state[id]) return;
        state[id].boosts.push({rule, b});
        state[id].boost += b;
      });
    }
  });

  // 기본 술전 검사 (AAO PPP 표준 평가)
  [T.OCT, T.TOPO, T.OSD, T.BIOM].forEach(addTest);
  // 미측정 항목 → 추가검사
  if (d.mode === "pro"){
    if (d.cornealSA === null || d.cornealComa === null || d.hoaRMS === null) addTest(T.ABERRO);
    if (d.chordMu === null && d.chordAlpha === null) addTest(T.KAPPA);
    if (d.pupMesopic === null || d.pupPhotopic === null) addTest(T.PUPIL);
    if (d.cylD === null) addTest(T.TCA);
  } else {
    [T.ABERRO, T.PUPIL, T.TCA].forEach(addTest);
  }
  d._unknowns.forEach(k => (CRITICAL_UNKNOWN[k].tests || []).forEach(tk => addTest(T[tk])));

  /* 비용 척도의 양 끝 — 토릭은 모든 후보에 같은 금액이 더해지므로 렌즈 사이의
     상대적 부담을 바꾸지 않는다. 그래서 점수에는 토릭을 뺀 본체 금액만 쓰고,
     토릭 추가금은 화면에 금액을 보여줄 때만 더한다. */
  const _prices = LENSES.map(l => costMid(l.id)).filter(v => v !== null);
  const costFloor = _prices.length ? Math.min(..._prices) : 0;
  const costSpan  = _prices.length ? Math.max(..._prices) - costFloor : 0;

  // 점수
  const scored = LENSES.map(l => {
    const st = state[l.id];
    const pb = prefBreakdown(d, l, {floor:costFloor, span:costSpan});
    const blocked = st.stops.length > 0;
    const score = blocked ? 0 : clamp(
      Math.round(l.base + 30 + pb.total * 3.5 - st.penalty * 7 + st.boost * 5), 3, 100);
    return {
      id:l.id, lens:l, score, blocked, price:pb.price,
      stops:st.stops, cautions:st.cautions.slice().sort((a,b)=>b.w-a.w), boosts:st.boosts,
      penalty:st.penalty, pref:pb
    };
  });

  const viable = scored.filter(s => !s.blocked).sort((a,b) => b.score - a.score);
  const blockedList = scored.filter(s => s.blocked)
    .sort((a,b) => b.stops.length - a.stops.length);

  /* 예전에는 소구경 IOL 을 특정 상황에서만 상위로 올리는 예외 처리가 여기 있었다.
     소구경 IOL 을 뺀 지금은 필요 없다. 굴절형 분절 이중초점(렌티스)도 같은 예외가
     필요 없는데, 코마·고위수차 규칙이 삼중초점을 감점하면서 렌티스에는 가산을
     주므로 순위가 자연스럽게 뒤집히기 때문이다. */

  const top = viable[0] || scored.find(s => s.id === "mono");
  const alternatives = viable.slice(1, 4);
  const avoid = blockedList.concat(viable.filter(v => v.score < 32 && v !== top));

  return {
    d, top, alternatives, viable, blocked:blockedList, avoid, notes, fired,
    scored: scored.slice().sort((a,b) => (b.blocked?-1:b.score) - (a.blocked?-1:a.score)),
    tests: Array.from(testSet.values()),
    unknowns: d._unknowns,
    prefUnanswered: d._prefUnanswered,
    /* 토릭이 붙을 가능성이 높은가 — 금액 표시에만 쓴다 (점수에는 영향 없음) */
    toricLikely: d.toricPlanned === true || (num(d.cylD) !== null && d.cylD >= 1.0),
    allStopRules: Array.from(new Set([].concat(...scored.map(s => s.stops)))),
    allCautionRules: (() => {
      const m = new Map();
      scored.forEach(s => s.cautions.forEach(c => {
        const cur = m.get(c.rule.id);
        if (!cur) m.set(c.rule.id, {rule:c.rule, lenses:[{id:s.id, w:c.w}]});
        else cur.lenses.push({id:s.id, w:c.w});
      }));
      return Array.from(m.values());
    })()
  };
}

const STR = {
 ko:{
